[project]
name = "translate-manual"
version = "0.1.0"
description = "Translate Markdown manuals with Claude and a RAG translation memory."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.49",
    "chromadb>=0.5",
    "python-dotenv>=1.0",
    "click>=8.1",
]

[project.scripts]
translate-manual = "translate_manual.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
