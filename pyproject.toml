[project]
name = "translate-manual"
version = "0.1.0"
description = "Translate Markdown manuals with Claude and a RAG translation memory."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.49",
    "chromadb>=0.5",
    "python-dotenv>=1.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
translate-manual = "translate_manual.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["translate_manual*"]
